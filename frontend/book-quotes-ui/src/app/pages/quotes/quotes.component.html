<div class="quotes-container">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>
      <i class="fa-solid fa-quote-left"></i>
      Mina citat
    </h2>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">

      <h3 class="card-title">
        <i class="fa-solid fa-plus"></i>
        Lägg till citat
      </h3>

      <form (ngSubmit)="createQuote()">

        <div class="mb-3">
          <label for="quoteText" class="form-label">
            Citat
          </label>

          <textarea id="quoteText"
                    name="quoteText"
                    class="form-control"
                    rows="4"
                    [(ngModel)]="newQuote.text"
                    required>
          </textarea>
        </div>

        <button type="submit"
                class="btn btn-success">
          <i class="fa-solid fa-plus"></i>
          Lägg till citat
        </button>

      </form>

    </div>
  </div>

  @if (message) {
  <div class="alert alert-success">
    {{ message }}
  </div>
  }

  @if (errorMessage) {
  <div class="alert alert-danger">
    {{ errorMessage }}
  </div>
  }

  @if (quotes.length === 0) {
  <div class="alert alert-info">
    Du har inga citat ännu.
  </div>
  }

  @for (quote of quotes; track quote.id) {

  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <p class="card-text fs-5">
        <i class="fa-solid fa-quote-left"></i>
        {{ quote.text }}
        <i class="fa-solid fa-quote-right"></i>
      </p>

      <button type="button"
              class="btn btn-primary me-2"
              (click)="startEdit(quote)">
        <i class="fa-solid fa-pen"></i>
        Redigera
      </button>

      <button type="button"
              class="btn btn-danger"
              (click)="deleteQuote(quote.id)">
        <i class="fa-solid fa-trash"></i>
        Ta bort
      </button>

    </div>
  </div>

  }

  @if (editingQuoteId !== null) {

  <div class="card shadow-sm mb-4">
    <div class="card-body">

      <h3 class="card-title">
        <i class="fa-solid fa-pen"></i>
        Redigera citat
      </h3>

      <form (ngSubmit)="updateQuote()">

        <div class="mb-3">
          <label for="editQuoteText"
                 class="form-label">
            Citat
          </label>

          <textarea id="editQuoteText"
                    name="editQuoteText"
                    class="form-control"
                    rows="4"
                    [(ngModel)]="editQuote.text"
                    required>
            </textarea>
        </div>

        <button type="submit"
                class="btn btn-success me-2">
          <i class="fa-solid fa-check"></i>
          Spara ändringar
        </button>

        <button type="button"
                class="btn btn-secondary"
                (click)="cancelEdit()">
          <i class="fa-solid fa-xmark"></i>
          Avbryt
        </button>

      </form>

    </div>
  </div>

  }

</div>
